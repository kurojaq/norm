<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Normalized Session Clock — Scrub + Alarm</title>

<style>
    body {
        background-color: #0b0b0b;
        color: #ffffff;
        font-family: "Segoe UI", Roboto, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .clock-container {
        text-align: center;
    }

    .normalized {
        font-size: 4rem;
        letter-spacing: 0.15em;
    }

    .label {
        margin-top: 10px;
        font-size: 1rem;
        opacity: 0.6;
    }

    .time {
        margin-top: 15px;
        font-size: 1.1rem;
        opacity: 0.85;
    }

    .bar {
        width: 420px;
        height: 6px;
        background: #222;
        margin: 25px auto;
        border-radius: 4px;
        overflow: hidden;
    }

    .fill {
        height: 100%;
        width: 0%;
        background: #ffffff;
        transition: width 0.2s linear;
    }

    input[type=range] {
        width: 420px;
        margin-top: 15px;
    }

    input[type=number] {
        padding: 5px;
        width: 200px;
        background: #111;
        border: 1px solid #333;
        color: #fff;
    }

    button {
        margin-top: 10px;
        padding: 6px 14px;
        background: #111;
        color: #fff;
        border: 1px solid #333;
        cursor: pointer;
    }

    button:hover {
        background: #222;
    }
</style>
</head>

<body>

<div class="clock-container">

    <div class="normalized" id="normalized">0.0000</div>
    <div class="label">Normalized Session Time (6:00 PM → 5:00 PM)</div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

    <!-- Scrubber -->
    <input type="range" id="scrubber" min="0" max="1" step="0.0001" value="0">

    <div class="time" id="localtime">Live Time: --:--:--</div>
    <div class="time" id="scrubbedTime">Mapped Time: --:--:--</div>

    <button id="toggleMode">Switch to Scrub Mode</button>

    <!-- Alarm -->
    <div style="margin-top:20px;">
        <input type="number" id="alarmInput" min="0" max="1" step="0.0001" placeholder="Set N (0 → 1)">
        <br>
        <button id="setAlarm">Set Alarm</button>
        <button id="clearAlarm">Clear</button>
    </div>

    <div class="time" id="alarmStatus">Alarm: None</div>

</div>

<script>

// --- SESSION CORE ---

function getSessionStart(now) {
    let start = new Date(now);
    start.setHours(18, 0, 0, 0);

    if (now.getHours() < 18) {
        start.setDate(start.getDate() - 1);
    }

    return start;
}

function getNormalizedSessionTime() {
    const now = new Date();
    const start = getSessionStart(now);

    const sessionLength = 23 * 60 * 60 * 1000;
    const elapsed = now - start;

    let normalized = elapsed / sessionLength;
    return Math.max(0, Math.min(1, normalized));
}

function normalizedToTime(n) {
    const now = new Date();
    const start = getSessionStart(now);

    const sessionLength = 23 * 60 * 60 * 1000;
    return new Date(start.getTime() + (n * sessionLength));
}

// --- STATE ---

let isLive = true;
let alarmValue = null;
let alarmTriggered = false;

const normalizedEl = document.getElementById("normalized");
const fillEl = document.getElementById("fill");
const localTimeEl = document.getElementById("localtime");
const scrubbedTimeEl = document.getElementById("scrubbedTime");
const scrubber = document.getElementById("scrubber");

const toggleBtn = document.getElementById("toggleMode");
const alarmInput = document.getElementById("alarmInput");
const alarmStatus = document.getElementById("alarmStatus");

// --- SOUND (simple beep) ---

function playBeep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(() => osc.stop(), 300);
}

// --- ALARM CHECK ---

function checkAlarm(n) {
    if (alarmValue === null || alarmTriggered) return;

    // tolerance to avoid skipping exact match
    if (Math.abs(n - alarmValue) < 0.0005) {
        alarmTriggered = true;

        playBeep();

        alert(
            "Alarm Triggered\n\nN = " + alarmValue.toFixed(4)
        );
    }
}

// --- LIVE UPDATE ---

function updateClock() {
    const now = new Date();
    localTimeEl.innerText = "Live Time: " + now.toLocaleTimeString();

    if (!isLive) return;

    const n = getNormalizedSessionTime();

    normalizedEl.innerText = n.toFixed(4);
    fillEl.style.width = (n * 100).toFixed(2) + "%";
    scrubber.value = n;

    const t = normalizedToTime(n);
    scrubbedTimeEl.innerText = "Mapped Time: " + t.toLocaleTimeString();

    checkAlarm(n);
}

// --- SCRUB MODE ---

scrubber.addEventListener("input", function () {
    if (isLive) return;

    const n = parseFloat(this.value);

    normalizedEl.innerText = n.toFixed(4);
    fillEl.style.width = (n * 100).toFixed(2) + "%";

    const t = normalizedToTime(n);
    scrubbedTimeEl.innerText = "Scrubbed Time: " + t.toLocaleTimeString();
});

// --- TOGGLE MODE ---

toggleBtn.onclick = () => {
    isLive = !isLive;

    toggleBtn.innerText = isLive
        ? "Switch to Scrub Mode"
        : "Switch to Live Mode";
};

// --- SET / CLEAR ALARM ---

document.getElementById("setAlarm").onclick = () => {
    const val = parseFloat(alarmInput.value);

    if (isNaN(val) || val < 0 || val > 1) {
        alert("Enter a value between 0 and 1");
        return;
    }

    alarmValue = val;
    alarmTriggered = false;

    const t = normalizedToTime(val);

    alarmStatus.innerText =
        "Alarm Set → N=" + val.toFixed(4) +
        " (" + t.toLocaleTimeString() + ")";
};

document.getElementById("clearAlarm").onclick = () => {
    alarmValue = null;
    alarmTriggered = false;
    alarmStatus.innerText = "Alarm: None";
};

// --- INIT ---

updateClock();
setInterval(updateClock, 1000);

</script>

</body>
</html>
